<!doctype html>
<html lang="ko">
<head>

<style>
:root {
  --ink: #0b2230; --holo: rgba(10, 38, 54, .84); --edge: rgba(120, 232, 250, .75); --text: #e6fbff; --cyan: #7fe9ff; --dim: rgba(190, 230, 240, .72); --warm: #ffae7a;
  --font-display: "Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif; --font-body: "IBM Plex Sans KR", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #5f7b8f; color: var(--text); font-family: var(--font-body); }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; z-index: 5; }
.holo { background: var(--holo); border: 1px solid var(--edge); box-shadow: 0 0 16px rgba(88, 208, 232, .28), inset 0 0 12px rgba(88, 208, 232, .12); color: var(--text);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }
#nav { top: 14px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 300px); opacity: .5; transition: opacity .2s; }
#nav:hover, #nav:focus-within { opacity: 1; }
#nav button { font: 600 12px var(--font-display); letter-spacing: .04em; padding: 5px 12px; cursor: pointer; }

#badge { top: 14px; right: 14px; font: 500 12px var(--font-display); letter-spacing: .04em; padding: 6px 12px; color: var(--dim); }
#prompt { bottom: 24px; left: 50%; transform: translateX(-50%); font: 600 17px var(--font-display); letter-spacing: .03em; padding: 13px 30px; cursor: pointer; max-width: calc(100% - 40px); }
#prompt:hover { background: rgba(16, 64, 86, .92); }
#prompt:disabled { cursor: default; color: var(--dim); }
#prompt2 { bottom: 84px; left: 50%; transform: translateX(-50%); font: 600 13px var(--font-display); padding: 7px 16px; cursor: pointer; color: var(--cyan); }
#tip { pointer-events: none; font: 600 13px var(--font-display); padding: 5px 10px; transform: translate(14px, 14px); white-space: nowrap; }
#bubble { pointer-events: none; font-size: 14px; line-height: 1.55; padding: 11px 16px; max-width: 260px; transform: translate(-50%, calc(-100% - 10px)); }
#fail { inset: 0; display: grid; place-items: center; text-align: center; background: #0b2230; font-size: 16px; padding: 24px; }
#fail a { color: var(--cyan); }
button { border: 0; }
button:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c" aria-label="1인칭 3D 실험실"></canvas>
<nav id="nav" class="ui" aria-label="장면 이동"></nav>
<div id="badge" class="ui holo">시뮬레이션 · Pfizer 공개 데이터</div>
<button id="prompt2" class="ui holo" hidden></button>
<button id="prompt" class="ui holo"></button>
<div id="tip" class="ui holo" hidden></div>
<div id="bubble" class="ui holo" hidden></div>
<div id="fail" class="ui" hidden><p>이 브라우저에서는 3D를 표시할 수 없어요.<br><a href="../demo/index.html">2D 데모 열기</a></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../demo/data.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- data
const D = window.DEMO;
const NEAR = 5, MANUAL_TRIES = 12;
const GLOBAL = { random: 27.1, bo: 21.1, history: 16.5, ai: 13.7, hit20: 87, bh: 65 };   // report 4.2 / 4.3
const noteOf = (slot, name) => (D.mols[slot + "|" + name] || {}).note || name;
const S = { scene: "lobby", sel: 0, pair: 0, opened: false,
  manual: null, ai: null };
function resetRuns() {
  S.manual = { picks: { ligand: null, base: null, solvent: null }, tries: [], best: 0, foundAt: null };
  S.ai = { round: 0, revealed: [], best: 0, foundAt: null };
}
resetRuns();
const P = () => D.pairs[S.pair];
function lists(p) {
  const L = [], B = [], V = [];
  p.conds.forEach(c => { if (!L.includes(c[0])) L.push(c[0]); if (!B.includes(c[1])) B.push(c[1]); if (!V.includes(c[2])) V.push(c[2]); });
  return { ligand: L, base: B, solvent: V };
}
const stars = p => p.nearCount <= 3 ? "★★★" : p.nearCount <= 8 ? "★★" : "★";

// ---------------------------------------------------------------- three setup
const canvas = document.getElementById("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById("fail").hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = !location.search.includes("lite"); renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5f7b8f);
scene.fog = new THREE.Fog(0x5f7b8f, 16, 34);
const camera = new THREE.PerspectiveCamera(56, 1, 0.03, 100);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x40566a, 0.6));
const sun = new THREE.DirectionalLight(0xfff6ec, 1.0); sun.position.set(2.5, 7, 4.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 20 }); sun.shadow.bias = -0.0005; scene.add(sun);
const cool = new THREE.PointLight(0x7fe0f5, 0.9, 6); cool.position.set(0.45, 2.4, -1.8); scene.add(cool);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const M = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.5, metalness: 0.05 }, extra || {}));
const B = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
function add(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = !(mat.transparent || mat.isMeshBasicMaterial); (parent || scene).add(m); return m; }
function group(x, y, z, parent) { const g = new THREE.Group(); g.position.set(x, y, z); (parent || scene).add(g); return g; }
function canvasTex(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.encoding = THREE.sRGBEncoding; return { c, ctx: c.getContext("2d"), tex }; }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function screenPlane(w, h, cw, ch, x, y, z, ry, parent) {
  const t = canvasTex(cw, ch); const m = add(new THREE.PlaneGeometry(w, h), B(0xffffff, { map: t.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }), x, y, z, parent); m.rotation.y = ry || 0; return Object.assign(t, { mesh: m });
}
const FD = (px) => `600 ${px}px "Chakra Petch", "IBM Plex Sans KR", sans-serif`;
const FB = (px, w) => `${w || 400} ${px}px "IBM Plex Sans KR", sans-serif`;
const HC = { edge: "rgba(120,232,250,0.95)", text: "#e6fbff", cyan: "#7fe9ff", dim: "rgba(190,230,240,0.72)", amber: "#ffd36b", green: "#6ff0b0", orange: "#ffae7a", grid: "rgba(127,233,255,0.14)" };
function holoPanel(x, w, h) {
  x.clearRect(0, 0, w, h);
  const p = 8, c = Math.min(w, h) * 0.09, g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(16,70,94,0.74)"); g.addColorStop(1, "rgba(8,32,48,0.6)");
  x.beginPath(); x.moveTo(p + c, p); x.lineTo(w - p, p); x.lineTo(w - p, h - p - c); x.lineTo(w - p - c, h - p); x.lineTo(p, h - p); x.lineTo(p, p + c); x.closePath();
  x.fillStyle = g; x.fill();
  x.save(); x.shadowColor = "rgba(88,208,232,0.9)"; x.shadowBlur = 16; x.strokeStyle = HC.edge; x.lineWidth = 3; x.stroke(); x.restore();
  x.save(); x.clip(); x.fillStyle = "rgba(160,240,255,0.045)"; for (let y = p; y < h; y += 6) x.fillRect(0, y, w, 2); x.restore();
  x.fillStyle = HC.edge; x.fillRect(w - p - 70, p + 14, 50, 4); x.fillRect(p + 18, h - p - 18, 50, 4);
}
function glow(x, t, X, Y, font, col, maxW, blur) {
  x.save(); x.font = font;
  if (maxW) { let px = +font.match(/(\d+)px/)[1]; while (x.measureText(t).width > maxW && px > 12) { px -= 2; x.font = font.replace(/\d+px/, px + "px"); } }
  x.shadowColor = col; x.shadowBlur = blur === undefined ? 12 : blur; x.fillStyle = col; x.fillText(t, X, Y); x.restore();
}
function tag(x, t, X, Y) { x.save(); x.font = FD(24); if ("letterSpacing" in x) x.letterSpacing = "4px"; x.fillStyle = HC.dim; x.fillText(t, X, Y); x.restore(); }

// ---------------------------------------------------------------- room
{ const t = canvasTex(256, 256); t.ctx.fillStyle = "#4f6578"; t.ctx.fillRect(0, 0, 256, 256); t.ctx.fillStyle = "#566d81"; t.ctx.fillRect(0, 0, 128, 128); t.ctx.fillRect(128, 128, 128, 128);
  t.ctx.strokeStyle = "#3b4f60"; t.ctx.lineWidth = 3; t.ctx.strokeRect(0, 0, 256, 256); t.tex.wrapS = t.tex.wrapT = THREE.RepeatWrapping; t.tex.repeat.set(20, 20); t.tex.minFilter = THREE.LinearMipmapLinearFilter; t.tex.generateMipmaps = true;
  add(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: t.tex, roughness: 0.35, metalness: 0.1 }), 0, 0, 0).rotation.x = -Math.PI / 2; }
const wallM = M(0xb4cfdd);
add(new THREE.BoxGeometry(16, 4.2, 0.2), wallM, 0, 2.1, -4.1);
add(new THREE.BoxGeometry(0.2, 4.2, 11.2), wallM, -8.1, 2.1, 1.5);
add(new THREE.BoxGeometry(0.2, 4.2, 11.2), wallM, 8.1, 2.1, 1.5);
add(new THREE.BoxGeometry(6.5, 4.2, 0.2), wallM, -4.75, 2.1, 7.1);
add(new THREE.BoxGeometry(6.5, 4.2, 0.2), wallM, 4.75, 2.1, 7.1);
add(new THREE.BoxGeometry(3, 1.6, 0.2), wallM, 0, 3.4, 7.1);
const panelM = M(0x35566c);
add(new THREE.BoxGeometry(16.2, 1.0, 0.06), panelM, 0, 0.5, -3.97); add(new THREE.BoxGeometry(0.06, 1.0, 11.2), panelM, -7.97, 0.5, 1.5); add(new THREE.BoxGeometry(0.06, 1.0, 11.2), panelM, 7.97, 0.5, 1.5);
add(new THREE.BoxGeometry(16.2, 0.05, 0.08), M(0x58d0e8, { emissive: 0x2a9fd0, emissiveIntensity: 0.6 }), 0, 1.02, -3.95);
add(new THREE.PlaneGeometry(16.2, 11.2), M(0xdfe8ee), 0, 4.2, 1.5).rotation.x = Math.PI / 2;
[[-3.5, -1.5], [3.5, -1.5], [-3.5, 3.5], [3.5, 3.5]].forEach(([x, z]) => add(new THREE.BoxGeometry(1.6, 0.04, 0.6), B(0xf4fbff), x, 4.17, z));
// fume hood (back wall, right)
{ const h = group(4.3, 0, -3.5); add(new THREE.BoxGeometry(2.4, 0.9, 0.9), M(0x6f8ea3), 0, 0.45, 0, h); add(new THREE.BoxGeometry(2.4, 0.06, 0.95), M(0xf2f6f8), 0, 0.93, 0, h);
  add(new THREE.BoxGeometry(2.4, 1.5, 0.08), M(0xe7eef2), 0, 1.7, -0.42, h); add(new THREE.BoxGeometry(0.1, 1.5, 0.9), M(0xe7eef2), -1.15, 1.7, 0, h); add(new THREE.BoxGeometry(0.1, 1.5, 0.9), M(0xe7eef2), 1.15, 1.7, 0, h);
  add(new THREE.BoxGeometry(2.4, 0.5, 0.9), M(0xe7eef2), 0, 2.7, 0, h); add(new THREE.BoxGeometry(2.2, 1.0, 0.03), M(0xbfe6f5, { transparent: true, opacity: 0.35 }), 0, 1.75, 0.43, h);
  [-0.6, 0, 0.6].forEach(x => add(new THREE.CylinderGeometry(0.06, 0.09, 0.22, 14), M(0xff9f6b), x, 1.07, -0.1, h)); }
// wall cabinets (left wall)
[-2.4, -0.6, 1.2].forEach(z => { add(new THREE.BoxGeometry(0.6, 0.9, 1.6), M(0x6f8ea3), -7.7, 0.45, z); add(new THREE.BoxGeometry(0.65, 0.05, 1.65), M(0xf2f6f8), -7.7, 0.93, z); });
const ringLight = add(new THREE.TorusGeometry(1.1, 0.05, 8, 48), B(0x9fe6f5), 0.4, 4.1, -2.3); ringLight.rotation.x = Math.PI / 2;

// ---------------------------------------------------------------- interaction registry
const clickables = [];
function clickable(obj, label, fn, when) { obj.userData.click = { label, fn, when: when || (() => true) }; clickables.push(obj); return obj; }
function setGlow(obj, on) {
  obj.traverse(m => {
    if (!m.material || !m.material.emissive) return;
    if (m.userData.e0 === undefined) m.userData.e0 = m.material.emissive.getHex();
    m.material.emissive.setHex(on ? 0x2a9fd0 : m.userData.e0);
  });
}
const tweens = [];
function tween(d, fn, done) { tweens.push({ t: 0, d, fn, done }); }

// ---------------------------------------------------------------- lobby: door, sign, board, marquee
const doorM = () => M(0x9cc9dc, { roughness: 0.15, metalness: 0.2 });
const doorL = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), doorM(), -0.75, 1.3, 7.1);
const doorR = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), doorM(), 0.75, 1.3, 7.1);
[-0.06, 0.06].forEach(x => add(new THREE.BoxGeometry(0.03, 0.5, 0.05), M(0x35566c), x, 1.25, 7.17));
add(new THREE.BoxGeometry(3.3, 0.12, 0.3), M(0x35566c), 0, 2.66, 7.1); [-1.6, 1.6].forEach(x => add(new THREE.BoxGeometry(0.12, 2.7, 0.3), M(0x35566c), x, 1.35, 7.1));
const doorGroup = new THREE.Group(); doorGroup.add(doorL, doorR); scene.add(doorGroup);
clickable(doorGroup, "실험실 문", () => enterLab(), () => S.scene === "lobby");
const sign = screenPlane(2.2, 0.5, 880, 200, 0, 2.95, 7.21);
holoPanel(sign.ctx, 880, 200); sign.ctx.textAlign = "center"; sign.ctx.textBaseline = "middle"; glow(sign.ctx, "REACTPILOT LAB", 440, 106, FD(84), HC.cyan, 760, 18);
function drawLobby() {}

// ---------------------------------------------------------------- select: carousel
const TT = group(-4.5, 0, 0);
add(new THREE.CylinderGeometry(1.55, 1.7, 0.9, 40), M(0x35566c), 0, 0.45, 0, TT); add(new THREE.CylinderGeometry(1.56, 1.56, 0.04, 40), M(0xf2f6f8), 0, 0.91, 0, TT);
const spin = group(0, 0.92, 0, TT);
const slotGroups = [];
D.pairs.forEach((p, i) => {
  const a = i * 2 * Math.PI / D.pairs.length, g = group(Math.sin(a) * 1.3, 0, Math.cos(a) * 1.3, spin);
  const hue = 0.5 + 0.05 * (i % 5);
  add(new THREE.CylinderGeometry(0.07, 0.08, 0.26, 16), M(new THREE.Color().setHSL(hue, 0.5, 0.7)), -0.06, 0.13, 0, g);
  add(new THREE.CylinderGeometry(0.07, 0.08, 0.2, 16), M(new THREE.Color().setHSL(hue + 0.1, 0.5, 0.75)), 0.08, 0.1, 0, g);
  add(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 12), M(0x17303f), -0.06, 0.29, 0, g);
  clickable(g, "", () => { if (i === S.sel) choosePair(); else { S.sel = i; onSel(); } }, () => S.scene === "select");
  g.userData.idx = i; slotGroups.push(g);
});
const arrowM = () => M(0x1f8fbf);
const arL = add(new THREE.ConeGeometry(0.16, 0.34, 3), arrowM(), -6.35, 1.35, 1.0); arL.rotation.z = Math.PI / 2;
const arR = add(new THREE.ConeGeometry(0.16, 0.34, 3), arrowM(), -2.65, 1.35, 1.0); arR.rotation.z = -Math.PI / 2;
clickable(arL, "이전 반응", () => { S.sel = (S.sel + D.pairs.length - 1) % D.pairs.length; onSel(); }, () => S.scene === "select");
clickable(arR, "다음 반응", () => { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }, () => S.scene === "select");
const holo = group(-4.5, 2.05, 0.2);
add(new THREE.CylinderGeometry(0.75, 1.1, 1.2, 32, 1, true), B(0x9fe6f5, { transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false }), -4.5, 1.5, 0.2);
const molA = group(-0.45, 0, 0, holo), molB = group(0.45, 0, 0, holo);
const selLabel = screenPlane(2.6, 0.75, 1040, 300, -4.5, 3.0, 0.4);
const CPK = { C: 0x5b6b75, N: 0x3b6fe0, O: 0xe0503b, Cl: 0x3fbf5f, Br: 0xa0522d, I: 0x8a2be2, F: 0x7fd0a0, S: 0xe0c040, B: 0xf09090, P: 0xff9f40, K: 0x9b59d0 };
function buildMol(gr, mol) {
  while (gr.children.length) gr.remove(gr.children[0]);
  if (!mol) return;
  const lines = mol.split("\n"), na = parseInt(lines[3].slice(0, 3)), nb = parseInt(lines[3].slice(3, 6));
  const atoms = [];
  for (let i = 0; i < na; i++) { const l = lines[4 + i]; atoms.push({ p: new THREE.Vector3(+l.slice(0, 10), +l.slice(10, 20), +l.slice(20, 30)), s: l.slice(31, 34).trim() }); }
  const heavy = atoms.filter(a => a.s !== "H"); const c = new THREE.Vector3(); heavy.forEach(a => c.add(a.p)); c.divideScalar(heavy.length);
  const sc = 0.055;
  atoms.forEach(a => { if (a.s === "H") return; add(new THREE.SphereGeometry(a.s === "C" ? 0.028 : 0.036, 12, 10), M(CPK[a.s] || 0x999999), (a.p.x - c.x) * sc, (a.p.y - c.y) * sc, (a.p.z - c.z) * sc, gr); });
  for (let i = 0; i < nb; i++) {
    const l = lines[4 + na + i], a = atoms[parseInt(l.slice(0, 3)) - 1], b = atoms[parseInt(l.slice(3, 6)) - 1];
    if (a.s === "H" || b.s === "H") continue;
    const pa = a.p.clone().sub(c).multiplyScalar(sc), pb = b.p.clone().sub(c).multiplyScalar(sc), len = pa.distanceTo(pb);
    const m = add(new THREE.CylinderGeometry(0.009, 0.009, len, 6), M(0xb9c9d3), 0, 0, 0, gr);
    m.position.copy(pa).add(pb).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pb.clone().sub(pa).normalize());
  }
}
function onSel() {
  const p = D.pairs[S.sel];
  buildMol(molA, (D.mols["electrophile|" + p.electrophile] || {}).mol);
  buildMol(molB, (D.mols["nucleophile|" + p.nucleophile] || {}).mol);
  const x = selLabel.ctx; holoPanel(x, 1040, 300); x.textAlign = "left";
  tag(x, `SUBSTRATE ${String(S.sel + 1).padStart(2, "0")} / ${D.pairs.length}`, 64, 76);
  x.textAlign = "right"; glow(x, `난이도 ${stars(p)}`, 976, 78, FD(30), HC.amber, 300, 6); x.textAlign = "left";
  glow(x, noteOf("electrophile", p.electrophile), 64, 160, FD(50), HC.text, 900, 8);
  glow(x, "+ " + noteOf("nucleophile", p.nucleophile), 64, 232, FD(50), HC.cyan, 900, 8);
  selLabel.tex.needsUpdate = true;
  drawPad();
}

// ---------------------------------------------------------------- bench, reactor, shelf, plate, red button
add(new THREE.BoxGeometry(5.6, 0.1, 1.5), M(0x2b3d4a, { roughness: 0.3 }), 0.1, 0.9, -2.4);
add(new THREE.BoxGeometry(5.4, 0.85, 1.3), M(0x6f8ea3), 0.1, 0.43, -2.4);
const RX = 0.45, RZ = -2.35;

add(new THREE.CylinderGeometry(0.28, 0.28, 0.6, 32, 1, true), M(0xe9f7fc, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }), RX, 1.39, RZ);
add(new THREE.CylinderGeometry(0.31, 0.31, 0.06, 32), M(0x7fa3b5), RX, 1.71, RZ);

add(new THREE.CylinderGeometry(0.02, 0.02, 0.36, 8), M(0x7fa3b5), 0, 0.15, 0, lever);

clickable(lever, "레버: 반응 시작", () => pullLever(), () => (S.scene === "manual" && manualReady()) || (S.scene === "lab" && S.ai.round < 10));
const rScreen = screenPlane(0.84, 0.29, 640, 220, RX, 2.0, RZ - 0.2);

  x.font = FB(20); x.fillStyle = HC.dim; x.fillText(`상위 20개 안 성공 ${GLOBAL.hit20}% · BH 실험 ${GLOBAL.bh}% 감소`, R + 32, 818);
  monitor.tex.needsUpdate = true;
}

// ---------------------------------------------------------------- actions
function enterLab() {
  if (S.opened) { go("select"); return; }
  S.opened = true;
  tween(reduceMotion ? 0.01 : 0.9, k => { doorL.position.x = -0.75 - 1.4 * k; doorR.position.x = 0.75 + 1.4 * k; }, () => go("select"));
}
function choosePair() { S.pair = S.sel; resetRuns(); buildShelf(); paintPlate(); drawReactor("READY", "시약 3개"); go("manual"); }
function manualReady() { const k = S.manual.picks; return k.ligand && k.base && k.solvent && S.manual.tries.length < MANUAL_TRIES; }
function pick(slot, name, g) {
  const before = Object.values(S.manual.picks).filter(Boolean).length;
  if (!before) { liquidTarget = liquidLevel = 0.12; liquid.material.color.setHex(0x9fe6f5); }
  S.manual.picks[slot] = name;
  heldBody.material.color.setHex(SLOT_COLOR[slot]); held.visible = false;
  const bp = new THREE.Vector3(); g.getWorldPosition(bp); bp.y += 0.1;
  const A = reachPoint(bp), Bp = reachPoint(new THREE.Vector3(RX - 0.14, 1.98, RZ + 0.05));
  const n = Object.values(S.manual.picks).filter(Boolean).length;

    { from: HR0, to: A, d: 0.4, curl1: 0.75, onEnd: () => { held.visible = true; } },
    { from: A, to: Bp, d: 0.45, curl0: 0.75, curl1: 0.75 },
    { from: Bp, to: Bp, d: 0.75, curl0: 0.75, curl1: 0.75, tilt: 1, onStart: () => { stream.material.color.setHex(SLOT_COLOR[slot]); stream.visible = true; },
      onEnd: () => { stream.visible = false; held.visible = false; liquidTarget = 0.12 + 0.29 * n; bubbleJump(); } },
    { from: Bp, to: HR0, d: 0.4, curl0: 0.4 }]);
  bottles.forEach(b => { if (b.userData.slot === slot) b.position.y = b.userData.y0 ?? (b.userData.y0 = b.position.y); });
  if (g.userData.y0 === undefined) g.userData.y0 = g.position.y; g.position.y = g.userData.y0 + 0.05;
  drawPad(); updatePrompt();
  if (manualReady()) speak("레버를 당기면 반응이 시작돼요.");
}
function setLiquid(y) { liquid.material.color.setHSL(0.52 - 0.45 * y / 100, 0.75, 0.62); }
function pullLever() {
  { const lp = new THREE.Vector3(); leverKnob.getWorldPosition(lp); const L = reachPoint(lp), L2 = L.clone().add(new THREE.Vector3(0, -0.07, 0.04));
    runSeq([{ from: HR0, to: L, d: 0.35, curl1: 0.85 }, { from: L, to: L2, d: 0.3, curl0: 0.85, curl1: 0.85 }, { from: L2, to: HR0, d: 0.35, curl0: 0.85 }]); }
  liquidTarget = 1; held.visible = false;
  tween(0.3, k => { lever.rotation.z = -0.7 * Math.sin(k * Math.PI); });
  const p = P();
  if (S.scene === "manual") {
    const m = S.manual, k = m.picks, i = p.conds.findIndex(c => c[0] === k.ligand && c[1] === k.base && c[2] === k.solvent);
    const y = p.y[i]; m.tries.push({ c: [k.ligand, k.base, k.solvent], y }); m.best = Math.max(m.best, y);
    m.picks = { ligand: null, base: null, solvent: null };
    bottles.forEach(b => { if (b.userData.y0 !== undefined) b.position.y = b.userData.y0; });
    setLiquid(y); bubbleJump();
    const hit = y >= p.best - NEAR;
    drawReactor(`${y.toFixed(1)}%`, `${m.tries.length}번째 실험`, hit ? HC.green : HC.amber);
    if (hit && !m.foundAt) { m.foundAt = m.tries.length; flaskoSpin = 1; speak("준최적 조건이에요."); }
    else if (m.tries.length >= MANUAL_TRIES) speak("기회를 다 썼어요. 이번엔 AI 차례예요.");
    else speak(y < 20 ? "수율이 낮아요." : "나쁘지 않아요.");
  } else {
    const a = S.ai, idx = p.order.slice(a.round * 4, a.round * 4 + 4);
    idx.forEach((i, k) => { a.revealed.push(i); a.best = Math.max(a.best, p.y[i]); if (!a.foundAt && p.y[i] >= p.best - NEAR) a.foundAt = a.revealed.length; });
    a.round++; paintPlate(); setLiquid(a.best);
    const top = Math.max(...idx.map(i => p.y[i]));
    drawReactor(`${top.toFixed(1)}%`, `배치 ${a.round}`, a.foundAt ? HC.green : HC.amber);
    if (a.foundAt && a.foundAt > a.revealed.length - 4) { flaskoSpin = 1; speak(`${a.foundAt}번째 실험에서 찾았어요.`); }
    else if (a.round >= 10) speak("40회를 다 썼어요.");
    else speak("결과를 반영해 다시 골랐어요.");
  }
  drawPad(); updatePrompt();
}
function bubbleJump() { tween(0.6, k => { liquid.scale.x = liquid.scale.z = 1 + 0.07 * Math.sin(k * Math.PI * 4) * (1 - k); }); }

// ---------------------------------------------------------------- scenes
const SCENES = {
  lobby: { name: "입구", cam: [0, 1.7, 11.8], look: [0, 1.6, 7], fl: [1.75, 1.55, 8.6], say: "384개 조건, 어디부터 실험할까요?" },
  select: { name: "기질 보관함", cam: [-4.5, 1.75, 3.6], look: [-4.5, 1.6, 0], fl: [-2.7, 1.9, 1.3], say: "실험할 반응을 고르세요." },
  manual: { name: "직접 실험", cam: [-0.55, 1.72, -0.7], look: [-0.55, 1.5, -3.6], fl: [-2.5, 1.85, -1.6], say: "먼저 직접 해 보세요. 기회는 12번이에요." },
  lab: { name: "AI와 실험", cam: [1.1, 1.95, 0.75], look: [1.1, 1.0, -2.45], fl: [RX - 0.9, 2.0, -1.9], say: "과거 실험 기록으로 고른 4개예요." },
  report: { name: "나 vs AI", cam: [4.4, 1.85, -0.4], look: [7.9, 1.9, -0.4], fl: [6.6, 2.7, 0.9], say: "이번 반응과 15쌍 평균이에요." },
  how: { name: "원리", cam: [4.5, 1.8, 6.6], look: [4.5, 1.3, 3.4], fl: [3.1, 2.1, 4.6], say: "구슬을 눌러 보세요." },
};
const camPos = new THREE.Vector3(...SCENES.lobby.cam), camLook = new THREE.Vector3(...SCENES.lobby.look);
const camPosT = camPos.clone(), camLookT = camLook.clone();
const nav = document.getElementById("nav");
Object.entries(SCENES).forEach(([k, s]) => { const b = document.createElement("button"); b.textContent = s.name; b.className = "holo"; b.dataset.k = k; b.onclick = () => go(k); nav.appendChild(b); });
function go(k) {
  if (!SCENES[k]) k = "lobby";
  if (k !== "lobby" && !S.opened) { S.opened = true; doorL.position.x = -2.15; doorR.position.x = 2.15; }
  if ((k === "manual" || k === "lab" || k === "report") && !bottles.length) { S.pair = S.sel; resetRuns(); buildShelf(); }
  S.scene = k; const s = SCENES[k];
  camPosT.set(...s.cam); camLookT.set(...s.look); flaskoTarget.set(...s.fl);
  if (reduceMotion) { camPos.copy(camPosT); camLook.copy(camLookT); }
  if (k === "lab") { paintPlate(); if (!S.ai.revealed.length) drawReactor("AI READY", ""); }
  if (k === "report") drawMonitor();
  if (k === "select") onSel();
  speak(s.say); drawPad(); updatePrompt();
  [...nav.children].forEach(b => b.setAttribute("aria-current", b.dataset.k === k));
  if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
}
const promptBtn = document.getElementById("prompt"), prompt2 = document.getElementById("prompt2");
function updatePrompt() {
  const k = S.scene; let t = "", act = null, t2 = "", act2 = null;
  if (k === "lobby") { t = "입장"; act = enterLab; }
  else if (k === "select") { t = "이 반응으로 실험"; act = choosePair; t2 = "다음 반응 ▶"; act2 = () => { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }; }
  else if (k === "manual") {
    if (S.manual.tries.length >= MANUAL_TRIES || S.manual.foundAt) { t = "AI와 같은 반응 하기"; act = () => go("lab"); }
    else if (manualReady()) { t = "레버 당기기"; act = pullLever; t2 = "AI 부르기"; act2 = () => go("lab"); }
    else { t = "선반에서 시약 3개 고르기"; t2 = "AI 부르기"; act2 = () => go("lab"); }
  } else if (k === "lab") {
    if (S.ai.round < 10) { t = "레버 당기기 · 4개 실험"; act = pullLever; if (S.ai.revealed.length) { t2 = "결과 보기"; act2 = () => go("report"); } }
    else { t = "결과 보기"; act = () => go("report"); }
  } else if (k === "report") { t = "다른 반응"; act = () => go("select"); t2 = "원리 보기"; act2 = () => go("how"); }
  else { t = "입구로 돌아가기"; act = () => go("lobby"); }
  promptBtn.textContent = t; promptBtn.disabled = !act; promptBtn.onclick = act;
  prompt2.hidden = !t2; prompt2.textContent = t2; prompt2.onclick = act2;
}

// ---------------------------------------------------------------- input
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), look = { x: 0, y: 0 };
const tip = document.getElementById("tip");
let hovered = null, lastPoint = null;
function hitTest() {
  ray.setFromCamera(ptr, camera);
  for (const h of ray.intersectObjects(clickables, true)) {
    let o = h.object; while (o && !o.userData.click) o = o.parent;
    if (o && o.userData.click.when()) { lastPoint = h.point; return o; }
  }
  return null;
}
canvas.addEventListener("pointermove", e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); look.x = ptr.x; look.y = ptr.y;
  const o = hitTest();
  if (o !== hovered) { if (hovered) setGlow(hovered, false); hovered = o; if (o) setGlow(o, true); }
  const label = o ? (o.userData.click.label || (o.userData.idx === S.sel ? "이 반응 선택" : "이 반응으로 돌리기")) : "";
  tip.hidden = !label; tip.textContent = label; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  canvas.style.cursor = o ? "pointer" : "default";
});
canvas.addEventListener("click", e => { ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); const o = hitTest(); if (o) { if (!o.userData.selfAnim) reachTo(lastPoint); o.userData.click.fn(); } });
addEventListener("keydown", e => {
  if (S.scene === "select" && e.key === "ArrowLeft") { S.sel = (S.sel + D.pairs.length - 1) % D.pairs.length; onSel(); }
  if (S.scene === "select" && e.key === "ArrowRight") { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }
});
addEventListener("hashchange", () => go(location.hash.slice(1)));
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock(), v3 = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k = 1 - Math.exp(-dt * 3);
  camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
  camera.position.copy(camPos); camera.lookAt(camLook); camera.rotateY(-look.x * 0.18); camera.rotateX(look.y * 0.08);
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const q = Math.min(1, w.t / w.d); w.fn(q); if (q >= 1) { tweens.splice(i, 1); w.done && w.done(); } }
  // carousel
  const want = -S.sel * 2 * Math.PI / D.pairs.length; let d = want - spin.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); spin.rotation.y += d * k * 1.5;
  slotGroups.forEach((g, i) => { g.position.y = i === S.sel ? 0.06 + 0.02 * Math.sin(t * 3) : 0; });
  molA.rotation.y = molB.rotation.y = t * 0.6;
  // lever pulse when ready
  const ready = (S.scene === "manual" && manualReady()) || (S.scene === "lab" && S.ai.round < 10);
  leverKnob.scale.setScalar(ready ? 1 + 0.15 * Math.sin(t * 6) : 1);
  // hologram + orbs
  ringH.rotation.z = t * 0.5; orbs.forEach(o => { const a = t * 0.6 + o.userData.phase; o.position.set(Math.cos(a) * 0.9, 1.2 + 0.08 * Math.sin(t * 2 + o.userData.phase), Math.sin(a) * 0.9); });
  ringLight.material.color.setHSL(0.52, 0.7, 0.75 + 0.05 * Math.sin(t * 2));
  // Flasko
  flasko.position.lerp(flaskoTarget, k); flasko.position.y += Math.sin(t * 2.2) * 0.0025;
  v3.copy(camera.position); v3.y = flasko.position.y; flasko.lookAt(v3);
  prop.rotation.y = t * 18;
  if (flaskoSpin > 0) { flaskoSpin = Math.max(0, flaskoSpin - dt * 0.9); fBody.rotation.x = (1 - flaskoSpin) * Math.PI * 2; fBody.position.y = Math.sin((1 - flaskoSpin) * Math.PI) * 0.25; }
  else { fBody.rotation.x = 0; fBody.position.y = 0; }
  // hands
  const bob = Math.sin(t * 1.6) * 0.006;
  const padOn = S.scene === "select" || S.scene === "manual" || S.scene === "lab"; padMesh.visible = padOn;
  handL.position.set(HL0.x, HL0.y + bob - (padOn ? 0 : 0.12), HL0.z); padMesh.position.y = -0.13 + bob;
  handR.position.set(HR0.x, HR0.y - bob, HR0.z); handR.rotation.set(0.25, -0.25, 0.15);
  let curl = 0;
  if (seq.length) {
    const st = seq[0]; if (st.t === 0 && st.onStart) st.onStart();
    st.t += dt / st.d; const q = Math.min(1, st.t), e = q * q * (3 - 2 * q);
    handR.position.lerpVectors(st.from, st.to, e); handR.position.y -= bob; handR.rotation.x -= 0.3;
    curl = st.curl0 + (st.curl1 - st.curl0) * e;
    if (st.tilt) handR.rotation.z -= 1.25 * Math.sin(q * Math.PI);
    if (q >= 1) { seq.shift(); st.onEnd && st.onEnd(); }
  } else if (handAnim) {
    handAnim.t += dt / 0.65; const q = Math.min(1, handAnim.t), s = Math.sin(q * Math.PI);
    if (handAnim.kind === "reach") {
      const d = handAnim.target.clone().sub(HR0), len = Math.min(d.length() * 0.8, 0.42); d.setLength(len);
      handR.position.addScaledVector(d, s); handR.rotation.x -= 0.35 * s; curl = Math.max(0, Math.sin(Math.min(1, q * 1.4) * Math.PI));
    } else { handR.position.y -= 0.08 * s; handR.position.z -= 0.08 * s; handR.rotation.x += 0.6 * s; curl = s; }

  curlHand(handR, Math.max(curl, held.visible ? 0.55 : 0)); curlHand(handL, padMesh.visible ? 0.45 : 0.1); updateArms();
  liquidLevel += (liquidTarget - liquidLevel) * k * 2; liquid.scale.y = Math.max(0.05, liquidLevel); liquid.position.y = 1.09 + 0.15 * liquid.scale.y;
  // bubble follows Flasko
  v3.copy(flasko.position); v3.y += 0.38; v3.project(camera);
  const onScreen = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && bubbleText;
  bubble.hidden = !onScreen;
  if (onScreen) { bubble.style.left = Math.min(innerWidth - 140, Math.max(140, (v3.x + 1) / 2 * innerWidth)) + "px"; bubble.style.top = Math.max(110, (1 - v3.y) / 2 * innerHeight) + "px"; }
  renderer.render(scene, camera);

}

// ---------------------------------------------------------------- start
function redrawAll() { drawLobby(); drawHow(); onSel(); drawPad(); if (S.scene === "report") drawMonitor(); }
drawReactor("READY", "");
paintPlate();

if (document.fonts) Promise.all([document.fonts.load(FD(40), "가나ABC123"), document.fonts.load(FB(20), "가나ABC"), document.fonts.load(FB(20, 600), "가나")]).then(redrawAll, () => {});
go(location.hash.slice(1) || "lobby");
loop();
