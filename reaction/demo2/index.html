#tip { pointer-events: none; font: 600 13px var(--font-display); padding: 5px 10px; transform: translate(14px, 14px); white-space: nowrap; }
#bubble { pointer-events: none; font-size: 14px; line-height: 1.55; padding: 11px 16px; max-width: 260px; transform: translate(-50%, calc(-100% - 16px));
  background: rgba(10, 38, 54, .9); color: var(--text); border: 1.5px solid var(--edge); border-radius: 16px; box-shadow: 0 0 16px rgba(88, 208, 232, .3); clip-path: none; }

  border-right: 1.5px solid var(--edge); border-bottom: 1.5px solid var(--edge); transform: translateX(-50%) rotate(45deg); }

#fail { inset: 0; display: grid; place-items: center; text-align: center; background: #0b2230; font-size: 16px; padding: 24px; }
#fail a { color: var(--cyan); }
button { border: 0; }
button:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }

</head>

<script>

const stars = p => p.nearCount <= 3 ? "★★★" : p.nearCount <= 8 ? "★★" : "★";

// ---------------------------------------------------------------- three setup
const canvas = document.getElementById("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById("fail").hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = !location.search.includes("lite"); renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5f86ad);

const camera = new THREE.PerspectiveCamera(56, 1, 0.03, 100);
scene.add(camera);

const sun = new THREE.DirectionalLight(0xfff6ec, 0.65); sun.position.set(2.5, 7, 4.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 20 }); sun.shadow.bias = -0.0005; scene.add(sun);
const cool = new THREE.PointLight(0x7fe0f5, 1.2, 7); cool.position.set(0.45, 2.6, -2.0); scene.add(cool);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const M = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.5, metalness: 0.05 }, extra || {}));
const B = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
function add(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = !(mat.transparent || mat.isMeshBasicMaterial); (parent || scene).add(m); return m; }
function group(x, y, z, parent) { const g = new THREE.Group(); g.position.set(x, y, z); (parent || scene).add(g); return g; }
function canvasTex(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; tex.encoding = THREE.sRGBEncoding; return { c, ctx: c.getContext("2d"), tex }; }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function screenPlane(w, h, cw, ch, x, y, z, ry, parent) {
  const t = canvasTex(cw, ch); const m = add(new THREE.PlaneGeometry(w, h), B(0xffffff, { map: t.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }), x, y, z, parent); m.rotation.y = ry || 0; return Object.assign(t, { mesh: m });
}
const FD = (px) => `600 ${px}px "Chakra Petch", "IBM Plex Sans KR", sans-serif`;
const FB = (px, w) => `${w || 400} ${px}px "IBM Plex Sans KR", sans-serif`;
const HC = { edge: "rgba(120,232,250,0.95)", text: "#e6fbff", cyan: "#7fe9ff", dim: "rgba(190,230,240,0.72)", amber: "#ffd36b", green: "#6ff0b0", orange: "#ffae7a", grid: "rgba(127,233,255,0.14)" };
function holoPanel(x, w, h) {
  x.clearRect(0, 0, w, h);
  const p = 8, c = Math.min(w, h) * 0.09, g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(16,70,94,0.74)"); g.addColorStop(1, "rgba(8,32,48,0.6)");
  x.beginPath(); x.moveTo(p + c, p); x.lineTo(w - p, p); x.lineTo(w - p, h - p - c); x.lineTo(w - p - c, h - p); x.lineTo(p, h - p); x.lineTo(p, p + c); x.closePath();
  x.fillStyle = g; x.fill();
  x.save(); x.shadowColor = "rgba(88,208,232,0.9)"; x.shadowBlur = 16; x.strokeStyle = HC.edge; x.lineWidth = 3; x.stroke(); x.restore();
  x.save(); x.clip(); x.fillStyle = "rgba(160,240,255,0.045)"; for (let y = p; y < h; y += 6) x.fillRect(0, y, w, 2); x.restore();
  x.fillStyle = HC.edge; x.fillRect(w - p - 70, p + 14, 50, 4); x.fillRect(p + 18, h - p - 18, 50, 4);
}
function glow(x, t, X, Y, font, col, maxW, blur) {
  x.save(); x.font = font;
  if (maxW) { let px = +font.match(/(\d+)px/)[1]; while (x.measureText(t).width > maxW && px > 12) { px -= 2; x.font = font.replace(/\d+px/, px + "px"); } }
  x.shadowColor = col; x.shadowBlur = blur === undefined ? 12 : blur; x.fillStyle = col; x.fillText(t, X, Y); x.restore();
}
function tag(x, t, X, Y) { x.save(); x.font = FD(24); if ("letterSpacing" in x) x.letterSpacing = "4px"; x.fillStyle = HC.dim; x.fillText(t, X, Y); x.restore(); }

// ---------------------------------------------------------------- round lab (center 0, 0.6 · radius 8.6 · door at +z)
const CZ = 0.6, RAD = 8.6, GAP = 0.2;
{ const t = canvasTex(1024, 1024), c = t.ctx; c.fillStyle = "#b7cde2"; c.fillRect(0, 0, 1024, 1024);
  [[500, "#c3d6e8"], [380, "#b7cde2"], [300, "#a9c2db"], [180, "#c0d4e6"]].forEach(([r, col]) => { c.fillStyle = col; c.beginPath(); c.arc(512, 512, r, 0, 7); c.fill(); });
  c.strokeStyle = "#8fb0cf"; c.lineWidth = 4; [460, 340, 240].forEach(r => { c.beginPath(); c.arc(512, 512, r, 0, 7); c.stroke(); });
  const fl = add(new THREE.CircleGeometry(RAD, 72), new THREE.MeshStandardMaterial({ map: t.tex, roughness: 0.5 }), 0, 0.002, CZ); fl.rotation.x = -Math.PI / 2; }
add(new THREE.PlaneGeometry(60, 60), M(0x4f7396), 0, 0, 0).rotation.x = -Math.PI / 2;
const wallM = M(0x5f95cf, { side: THREE.DoubleSide });
add(new THREE.CylinderGeometry(RAD, RAD, 4.6, 72, 1, true, GAP, Math.PI * 2 - 2 * GAP), wallM, 0, 2.3, CZ);
add(new THREE.CylinderGeometry(RAD - 0.03, RAD - 0.03, 0.95, 72, 1, true, GAP, Math.PI * 2 - 2 * GAP), M(0x2f67a8, { side: THREE.DoubleSide }), 0, 0.475, CZ);
add(new THREE.CylinderGeometry(RAD - 0.04, RAD - 0.04, 0.5, 72, 1, true, GAP, Math.PI * 2 - 2 * GAP), M(0xeef5fb, { side: THREE.DoubleSide }), 0, 3.9, CZ);
{ const tr = add(new THREE.TorusGeometry(RAD - 0.05, 0.035, 6, 96), B(0x9ff0ff), 0, 0.97, CZ); tr.rotation.x = Math.PI / 2; }
add(new THREE.BoxGeometry(3.6, 1.85, 0.35), wallM, 0, 3.68, CZ + RAD);
{ const ce = add(new THREE.CircleGeometry(RAD, 72), M(0xb9cfe3, { side: THREE.DoubleSide }), 0, 4.6, CZ); ce.rotation.x = Math.PI / 2; }
const ringLight = add(new THREE.TorusGeometry(3.2, 0.09, 12, 96), B(0x9fe6f5), 0, 4.5, CZ); ringLight.rotation.x = Math.PI / 2;
{ const d = add(new THREE.CircleGeometry(0.95, 48), B(0xeafcff), 0.45, 4.58, -2.35); d.rotation.x = Math.PI / 2; }
// light beam over the reactor, with drifting hologram symbols
add(new THREE.CylinderGeometry(0.85, 0.45, 2.55, 40, 1, true), B(0x8ff0ff, { transparent: true, opacity: 0.09, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }), 0.45, 3.3, -2.35);
add(new THREE.CylinderGeometry(0.5, 0.3, 2.55, 32, 1, true), B(0xc9fbff, { transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }), 0.45, 3.3, -2.35);
const icons = ["+", "−", "△", "○", "×", "◇", "÷"].map((ch, i) => {
  const t = canvasTex(128, 128); t.ctx.textAlign = "center"; t.ctx.textBaseline = "middle"; glow(t.ctx, ch, 64, 66, FD(92), "#bff7ff", 0, 14);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, transparent: true, depthWrite: false })); sp.scale.set(0.2, 0.2, 1); sp.userData.ph = i / 7; scene.add(sp); return sp;
});
// hologram data wall at the back
{ const W = 2048, H = 760, t = canvasTex(W, H), c = t.ctx; let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0b2a44"); g.addColorStop(1, "#14425f"); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const hex = (x, y, r) => { c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; c[i ? "lineTo" : "moveTo"](x + r * Math.cos(a), y + r * Math.sin(a)); } c.closePath(); };
  c.strokeStyle = "rgba(127,233,255,0.08)"; c.lineWidth = 2;
  for (let row = 0; row < 14; row++) for (let col = 0; col < 34; col++) { hex(col * 66 + (row % 2) * 33, row * 57, 38); c.stroke(); }
  const mol = (x, y, r) => { c.save(); c.shadowColor = "#7fe9ff"; c.shadowBlur = 16; c.strokeStyle = "rgba(160,245,255,0.85)"; c.lineWidth = 4;
    hex(x, y, r); c.stroke(); hex(x + r * 1.732, y, r); c.stroke();
    const sub = [[x - r * 0.87, y - r * 0.5, -1.6], [x + r * 2.6, y + r * 0.5, 0.6]]; sub.forEach(([sx, sy, a]) => { c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); c.stroke(); });
    c.fillStyle = "#c9fbff"; for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; c.beginPath(); c.arc(x + r * Math.cos(a), y + r * Math.sin(a), 6, 0, 7); c.fill(); } c.restore(); };
  [[520, 230, 46], [880, 470, 40], [1240, 210, 52], [1560, 430, 44], [700, 600, 34], [1820, 220, 36]].forEach(([x, y, r]) => mol(x, y, r));
  c.strokeStyle = "rgba(127,233,255,0.35)"; c.lineWidth = 2; c.setLineDash([10, 12]);
  [[560, 230, 860, 470], [920, 470, 1240, 210], [1290, 230, 1560, 430], [1600, 430, 1820, 220]].forEach(([a, b, d, e]) => { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.stroke(); }); c.setLineDash([]);
  c.font = '600 30px "Chakra Petch", sans-serif'; c.fillStyle = "rgba(190,240,255,0.85)"; ["HTE SCREEN", "384 CONDITIONS", "LIGAND 12 · BASE 8 · SOLVENT 4"].forEach((l, i) => c.fillText(l, 70, 110 + i * 46));
  for (let i = 0; i < 12; i++) { const h = 30 + rnd() * 140; c.fillStyle = `rgba(127,233,255,${0.25 + rnd() * 0.5})`; c.fillRect(70 + i * 26, 640 - h, 16, h); }
  c.strokeStyle = "#ffd36b"; c.lineWidth = 4; c.beginPath(); for (let i = 0; i <= 40; i++) { const x = 1620 + i * 9, y = 680 - 150 * (1 - Math.exp(-i / 8)); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
  c.fillStyle = "rgba(160,240,255,0.05)"; for (let y = 0; y < H; y += 6) c.fillRect(0, y, W, 2);
  add(new THREE.PlaneGeometry(6.2, 2.3), B(0xffffff, { map: t.tex }), 0, 2.35, -7.35);
  add(new THREE.BoxGeometry(6.5, 0.14, 0.2), M(0xe3ecf4), 0, 3.55, -7.35); add(new THREE.BoxGeometry(6.5, 0.14, 0.2), M(0xe3ecf4), 0, 1.15, -7.35);
  [-3.2, 3.2].forEach(x => add(new THREE.BoxGeometry(0.14, 2.5, 0.2), M(0xe3ecf4), x, 2.35, -7.35));
  add(new THREE.BoxGeometry(6.0, 0.03, 0.06), B(0x9ff0ff), 0, 1.23, -7.28); }
// white consoles around the wall
function consoleAt(deg, holo) {
  const th = deg * Math.PI / 180, g = group(Math.sin(th) * 7.5, 0, CZ + Math.cos(th) * 7.5); g.rotation.y = th + Math.PI;
  add(new THREE.BoxGeometry(1.4, 0.82, 0.7), M(0xf2f6fa), 0, 0.41, 0, g);
  add(new THREE.BoxGeometry(1.2, 0.5, 0.02), M(0xb9cadb), 0, 0.42, 0.36, g);
  const top = add(new THREE.BoxGeometry(1.4, 0.07, 0.62), M(0xdde7f0), 0, 0.88, 0.02, g); top.rotation.x = 0.3;
  const scr = add(new THREE.PlaneGeometry(0.7, 0.28), B(0x6fe0ff), -0.15, 0.93, 0.05, g); scr.rotation.x = -Math.PI / 2 + 0.3;
  [[0.35, 0xff7a6b], [0.48, 0xffd36b], [0.35, 0x6ff0b0]].forEach(([x, col], i) => add(new THREE.BoxGeometry(0.07, 0.03, 0.07), M(col), x + (i === 2 ? 0.13 : 0), 0.93, i === 1 ? 0.12 : -0.02, g));
  if (holo) { const t = canvasTex(256, 384); holoPanel(t.ctx, 256, 384); t.ctx.textAlign = "center"; ["+", "△", "÷"].forEach((ch, i) => glow(t.ctx, ch, 128, 110 + i * 100, FD(80), "#bff7ff", 0, 12));
    add(new THREE.PlaneGeometry(0.85, 1.28), B(0xffffff, { map: t.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }), 0, 1.75, -0.1, g); }
}
consoleAt(52, true); consoleAt(-52, true); consoleAt(140); consoleAt(-140);

// ---------------------------------------------------------------- interaction registry
const clickables = [];

function setGlow(obj, on) {
  obj.traverse(m => {
    if (!m.material || !m.material.emissive) return;
    if (m.userData.e0 === undefined) m.userData.e0 = m.material.emissive.getHex();

const doorL = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), doorM(), -0.75, 1.3, 9.2);
const doorR = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), doorM(), 0.75, 1.3, 9.2);
[[doorL, 0.68], [doorR, -0.68]].forEach(([d, x]) => add(new THREE.BoxGeometry(0.03, 0.5, 0.05), M(0x35566c), x, -0.05, 0.07, d));
add(new THREE.BoxGeometry(3.3, 0.12, 0.4), M(0x2f6aa8), 0, 2.66, 9.2); [-1.6, 1.6].forEach(x => add(new THREE.BoxGeometry(0.12, 2.7, 0.4), M(0x2f6aa8), x, 1.35, 9.2));
const doorGroup = new THREE.Group(); doorGroup.add(doorL, doorR); scene.add(doorGroup);
clickable(doorGroup, "실험실 문", () => enterLab(), () => S.scene === "lobby");
const sign = screenPlane(2.2, 0.5, 880, 200, 0, 3.05, 9.4);
holoPanel(sign.ctx, 880, 200); sign.ctx.textAlign = "center"; sign.ctx.textBaseline = "middle"; glow(sign.ctx, "REACTPILOT LAB", 440, 106, FD(84), HC.cyan, 760, 18);
function drawLobby() {}

// ---------------------------------------------------------------- select: carousel
const TT = group(-4.5, 0, 0);
add(new THREE.CylinderGeometry(1.55, 1.7, 0.9, 40), M(0xe3ecf4), 0, 0.45, 0, TT); add(new THREE.CylinderGeometry(1.62, 1.62, 0.14, 40), M(0x5f95c8), 0, 0.25, 0, TT); add(new THREE.CylinderGeometry(1.56, 1.56, 0.04, 40), M(0xf2f6f8), 0, 0.91, 0, TT);

const slotGroups = [];
D.pairs.forEach((p, i) => {
  const a = i * 2 * Math.PI / D.pairs.length, g = group(Math.sin(a) * 1.3, 0, Math.cos(a) * 1.3, spin);

const arrowM = () => M(0x1f8fbf);

  const series = [["무작위", p.curves.random, "rgba(190,230,240,0.55)", 3], ["이력 기반 순위", p.curves.history, HC.amber, 3], ["AI", p.curves.ai, HC.cyan, 6]];
  if (me.length) series.push(["나", me, HC.orange, 6]);
  let lx = 72; x.font = FB(24);
  series.forEach(([name, , col]) => { x.fillStyle = col; x.fillRect(lx, 188, 28, 5); x.fillStyle = HC.text; x.fillText(name, lx + 38, 198); lx += 38 + x.measureText(name).width + 48; });
  x.strokeStyle = HC.grid; x.lineWidth = 1; x.font = FB(20); x.fillStyle = HC.dim;
  [0, 25, 50, 75, 100].forEach(v => { x.beginPath(); x.moveTo(L, sy(v)); x.lineTo(L + W, sy(v)); x.stroke(); x.textAlign = "right"; x.fillText(v + "%", L - 16, sy(v) + 7); });
  x.textAlign = "center"; [1, 10, 20, 30, 40].forEach(n => x.fillText(n, sx(n), T + H + 36)); x.fillText("실험 수", L + W / 2, T + H + 74);
  x.setLineDash([10, 10]); x.strokeStyle = HC.green; x.lineWidth = 2; x.beginPath(); x.moveTo(L, sy(p.best - NEAR)); x.lineTo(L + W, sy(p.best - NEAR)); x.stroke(); x.setLineDash([]);
  x.textAlign = "right"; x.fillStyle = HC.green; x.fillText("준최적 기준", L + W, sy(p.best - NEAR) - 12);
  series.forEach(([, ys, col, w]) => { x.save(); x.shadowColor = col; x.shadowBlur = w > 4 ? 10 : 0; x.strokeStyle = col; x.lineWidth = w; x.beginPath();
    ys.forEach((v, i) => i ? x.lineTo(sx(i + 1), sy(v)) : x.moveTo(sx(1), sy(v))); x.stroke(); x.restore(); });
  const R = 1030, card = (y, h) => { x.fillStyle = "rgba(127,233,255,0.07)"; x.fillRect(R, y, 500, h); x.strokeStyle = "rgba(127,233,255,0.3)"; x.lineWidth = 2; x.strokeRect(R, y, 500, h); };
  card(230, 260); card(520, 310); x.textAlign = "left";
  tag(x, "THIS RUN", R + 32, 276);
  const ai = p.aiFound, rows = [
    ["나", m.tries.length ? (m.foundAt ? `${m.foundAt}회째 발견` : `${m.tries.length}회 · 미발견`) : "건너뜀", HC.orange],
    ["AI", ai ? `${ai}회째 발견` : "40회 안 미발견", HC.cyan],
    ["무작위 기대", `${p.randomExpected}회`, HC.dim]];
  rows.forEach(([k, v, col], i) => { const y = 336 + i * 56; x.font = FB(24); x.fillStyle = HC.dim; x.fillText(k, R + 32, y); x.textAlign = "right"; glow(x, v, R + 468, y, FD(32), col, 300, 6); x.textAlign = "left"; });
  tag(x, "15-PAIR AVERAGE", R + 32, 566);
  x.font = FB(20); x.fillStyle = HC.dim; x.fillText("준최적 조건까지 실험 수 · 보고서 4.3", R + 32, 602);
  [["무작위", GLOBAL.random, "rgba(190,230,240,0.55)"], ["표준 BO", GLOBAL.bo, "rgba(190,230,240,0.85)"], ["이력 순위", GLOBAL.history, HC.amber], ["AI", GLOBAL.ai, HC.cyan]].forEach(([n, v, c], i) => {
    const y = 630 + i * 44, bw = v / 30 * 250; x.font = FB(22); x.fillStyle = HC.text; x.fillText(n, R + 32, y + 22); x.fillStyle = c; x.fillRect(R + 150, y + 6, bw, 22);
    x.font = FD(24); x.fillStyle = HC.text; x.fillText(v.toFixed(1), R + 162 + bw, y + 26); });
  x.font = FB(20); x.fillStyle = HC.dim; x.fillText(`상위 20개 안 성공 ${GLOBAL.hit20}% · BH 실험 ${GLOBAL.bh}% 감소`, R + 32, 818);
  monitor.tex.needsUpdate = true;
}

// ---------------------------------------------------------------- actions
const DOORWAY = [0, 1.7, 7.4];
const wait = (d, cb) => tween(reduceMotion ? 0.01 : d, () => {}, cb);
// doors fold into the wall pockets at the frame edges instead of sliding past the curved wall
function setDoor(k) { const w = 1 - 0.94 * k; doorL.scale.x = doorR.scale.x = w; doorL.position.x = -1.5 + 0.75 * w; doorR.position.x = 1.5 - 0.75 * w; }
let walking = false;
const fadeEl = document.getElementById("fade");
// black-out cut: fade to black, jump the camera, fade back in
function cut(fn) { fadeEl.style.opacity = 1; wait(0.38, () => { fn(); camPos.copy(camPosT); camLook.copy(camLookT); flasko.position.copy(flaskoTarget); fadeEl.style.opacity = 0; walking = false; }); }
function walk(dest) {          // lobby <-> inside
  if (walking) return; walking = true;
  if (dest !== "lobby") {
    const inside = () => { camPosT.set(...DOORWAY); camLookT.set(0, 1.6, 0); wait(0.6, () => cut(() => go(dest, true))); };
    if (S.opened) inside(); else { S.opened = true; tween(reduceMotion ? 0.01 : 0.8, setDoor, inside); }
  } else cut(() => { S.opened = false; setDoor(0); go("lobby", true); });
}
function enterLab() { go("select"); }
function choosePair() { S.pair = S.sel; resetRuns(); buildShelf(); paintPlate(); drawReactor("READY", "시약 3개"); go("manual"); }
function manualReady() { const k = S.manual.picks; return k.ligand && k.base && k.solvent && S.manual.tries.length < MANUAL_TRIES; }
function pick(slot, name, g) {
  const before = Object.values(S.manual.picks).filter(Boolean).length;
  if (!before) { liquidTarget = liquidLevel = 0.12; liquid.material.color.setHex(0x9fe6f5); }
  S.manual.picks[slot] = name;
  const n = Object.values(S.manual.picks).filter(Boolean).length;
  flyPour(g, slot, () => { liquidTarget = 0.12 + 0.29 * n; bubbleJump(); });
  bottles.forEach(b => { if (b.userData.slot === slot) b.position.y = b.userData.y0 ?? (b.userData.y0 = b.position.y); });
  if (g.userData.y0 === undefined) g.userData.y0 = g.position.y; g.position.y = g.userData.y0 + 0.05;
  drawPad(); updatePrompt();
  if (manualReady()) speak("레버를 당기면 반응이 시작돼요.");
}
function setLiquid(y) { liquid.material.color.setHSL(0.52 - 0.45 * y / 100, 0.75, 0.62); }
function pullLever() {
  liquidTarget = 1;
  tween(0.3, k => { lever.rotation.z = -0.7 * Math.sin(k * Math.PI); });
  const p = P();
  if (S.scene === "manual") {
    const m = S.manual, k = m.picks, i = p.conds.findIndex(c => c[0] === k.ligand && c[1] === k.base && c[2] === k.solvent);
    const y = p.y[i]; m.tries.push({ c: [k.ligand, k.base, k.solvent], y }); m.best = Math.max(m.best, y);
    m.picks = { ligand: null, base: null, solvent: null };
    bottles.forEach(b => { if (b.userData.y0 !== undefined) b.position.y = b.userData.y0; });
    setLiquid(y); bubbleJump();
    const hit = y >= p.best - NEAR;
    drawReactor(`${y.toFixed(1)}%`, `${m.tries.length}번째 실험`, hit ? HC.green : HC.amber);
    if (hit && !m.foundAt) { m.foundAt = m.tries.length; flaskoSpin = 1; speak("준최적 조건이에요."); }
    else if (m.tries.length >= MANUAL_TRIES) speak("기회를 다 썼어요. 이번엔 AI 차례예요.");
    else speak(y < 20 ? "수율이 낮아요." : "나쁘지 않아요.");
  } else {
    const a = S.ai, idx = p.order.slice(a.round * 4, a.round * 4 + 4);
    idx.forEach((i, k) => { a.revealed.push(i); a.best = Math.max(a.best, p.y[i]); if (!a.foundAt && p.y[i] >= p.best - NEAR) a.foundAt = a.revealed.length; });
    a.round++; paintPlate(); setLiquid(a.best);
    const top = Math.max(...idx.map(i => p.y[i]));
    drawReactor(`${top.toFixed(1)}%`, `배치 ${a.round}`, a.foundAt ? HC.green : HC.amber);
    if (a.foundAt && a.foundAt > a.revealed.length - 4) { flaskoSpin = 1; speak(`${a.foundAt}번째 실험에서 찾았어요.`); }
    else if (a.round >= 10) speak("40회를 다 썼어요.");
    else speak("결과를 반영해 다시 골랐어요.");
  }
  drawPad(); updatePrompt();
}
function bubbleJump() { tween(0.6, k => { liquid.scale.x = liquid.scale.z = 1 + 0.07 * Math.sin(k * Math.PI * 4) * (1 - k); }); }

// ---------------------------------------------------------------- scenes
const SCENES = {
  lobby: { name: "입구", cam: [0, 1.7, 13.6], look: [0, 1.6, 9.2], fl: [1.75, 1.55, 10.4], say: "384개 조건, 어디부터 실험할까요?" },
  select: { name: "기질 보관함", cam: [-4.5, 1.75, 3.6], look: [-4.5, 1.6, 0], fl: [-2.7, 1.9, 1.3], say: "실험할 반응을 고르세요." },
  manual: { name: "직접 실험", cam: [-0.45, 1.8, 0.55], look: [-0.45, 1.45, -2.9], fl: [-2.5, 1.85, -1.6], say: "먼저 직접 해 보세요. 기회는 12번이에요." },
  lab: { name: "AI와 실험", cam: [1.1, 1.95, 0.75], look: [1.1, 1.0, -2.45], fl: [-1.9, 2.55, -3.4], say: "과거 실험 기록으로 고른 4개예요." },
  report: { name: "나 vs AI", cam: [4.4, 1.85, -0.4], look: [7.9, 1.9, -0.4], fl: [6.6, 2.7, 0.9], say: "이번 반응과 15쌍 평균이에요." },
  how: { name: "원리", cam: [4.5, 1.8, 6.6], look: [4.5, 1.3, 3.4], fl: [3.1, 2.1, 4.6], say: "구슬을 눌러 보세요." },
};
const camPos = new THREE.Vector3(...SCENES.lobby.cam), camLook = new THREE.Vector3(...SCENES.lobby.look);
const camPosT = camPos.clone(), camLookT = camLook.clone();
const nav = document.getElementById("nav");
Object.entries(SCENES).forEach(([k, s]) => { const b = document.createElement("button"); b.textContent = s.name; b.className = "holo"; b.dataset.k = k; b.onclick = () => go(k); nav.appendChild(b); });
function go(k, direct) {
  if (!SCENES[k]) k = "lobby";
  if (!direct && (S.scene === "lobby") !== (k === "lobby")) { walk(k); return; }
  if (k !== "lobby" && !S.opened) { S.opened = true; setDoor(1); }
  if ((k === "manual" || k === "lab" || k === "report") && !bottles.length) { S.pair = S.sel; resetRuns(); buildShelf(); }
  S.scene = k; const s = SCENES[k];
  camPosT.set(...s.cam); camLookT.set(...s.look); flaskoTarget.set(...s.fl);
  if (reduceMotion) { camPos.copy(camPosT); camLook.copy(camLookT); }
  if (k === "lab") { paintPlate(); if (!S.ai.revealed.length) drawReactor("AI READY", ""); }
  if (k === "report") drawMonitor();
  if (k === "select") onSel();
  speak(s.say); drawPad(); updatePrompt();
  [...nav.children].forEach(b => b.setAttribute("aria-current", b.dataset.k === k));
  if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
}
const promptBtn = document.getElementById("prompt"), prompt2 = document.getElementById("prompt2");
function updatePrompt() {
  const k = S.scene; let t = "", act = null, t2 = "", act2 = null;
  if (k === "lobby") { t = "입장"; act = enterLab; }
  else if (k === "select") { t = "이 반응으로 실험"; act = choosePair; t2 = "다음 반응 ▶"; act2 = () => { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }; }
  else if (k === "manual") {
    if (S.manual.tries.length >= MANUAL_TRIES || S.manual.foundAt) { t = "AI와 같은 반응 하기"; act = () => go("lab"); }
    else if (manualReady()) { t = "레버 당기기"; act = pullLever; t2 = "AI 부르기"; act2 = () => go("lab"); }
    else { t = "선반에서 시약 3개 고르기"; t2 = "AI 부르기"; act2 = () => go("lab"); }
  } else if (k === "lab") {
    if (S.ai.round < 10) { t = "레버 당기기 · 4개 실험"; act = pullLever; if (S.ai.revealed.length) { t2 = "결과 보기"; act2 = () => go("report"); } }
    else { t = "결과 보기"; act = () => go("report"); }
  } else if (k === "report") { t = "다른 반응"; act = () => go("select"); t2 = "원리 보기"; act2 = () => go("how"); }
  else { t = "입구로 돌아가기"; act = () => go("lobby"); }
  promptBtn.textContent = t; promptBtn.disabled = !act; promptBtn.onclick = act;
  prompt2.hidden = !t2; prompt2.textContent = t2; prompt2.onclick = act2;
}

// ---------------------------------------------------------------- input
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), look = { x: 0, y: 0 };
const tip = document.getElementById("tip");
let hovered = null, lastPoint = null;
function hitTest() {
  ray.setFromCamera(ptr, camera);
  for (const h of ray.intersectObjects(clickables, true)) {
    let o = h.object; while (o && !o.userData.click) o = o.parent;
    if (o && o.userData.click.when()) { lastPoint = h.point; return o; }
  }
  return null;
}
canvas.addEventListener("pointermove", e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); look.x = ptr.x; look.y = ptr.y;
  const o = hitTest();
  if (o !== hovered) { if (hovered) setGlow(hovered, false); hovered = o; if (o) setGlow(o, true); }
  const label = o ? (o.userData.click.label || (o.userData.idx === S.sel ? "이 반응 선택" : "이 반응으로 돌리기")) : "";
  tip.hidden = !label; tip.textContent = label; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  canvas.style.cursor = o ? "pointer" : "default";
});
canvas.addEventListener("click", e => { ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); const o = hitTest(); if (o) o.userData.click.fn(); });
addEventListener("keydown", e => {
  if (S.scene === "select" && e.key === "ArrowLeft") { S.sel = (S.sel + D.pairs.length - 1) % D.pairs.length; onSel(); }
  if (S.scene === "select" && e.key === "ArrowRight") { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }
});
addEventListener("hashchange", () => go(location.hash.slice(1)));
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock(), v3 = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k = 1 - Math.exp(-dt * 3);
  camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
  camera.position.copy(camPos); camera.lookAt(camLook); camera.rotateY(-look.x * 0.18); camera.rotateX(look.y * 0.08);
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const q = Math.min(1, w.t / w.d); w.fn(q); if (q >= 1) { tweens.splice(i, 1); w.done && w.done(); } }
  // carousel
  const want = -S.sel * 2 * Math.PI / D.pairs.length; let d = want - spin.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); spin.rotation.y += d * k * 1.5;
  slotGroups.forEach((g, i) => { g.position.y = i === S.sel ? 0.06 + 0.02 * Math.sin(t * 3) : 0; });
  molA.rotation.y = molB.rotation.y = t * 0.6;
  // lever pulse when ready
  const ready = (S.scene === "manual" && manualReady()) || (S.scene === "lab" && S.ai.round < 10);
  leverKnob.scale.setScalar(ready ? 1 + 0.15 * Math.sin(t * 6) : 1);
  // hologram + orbs
  ringH.rotation.z = t * 0.5; orbs.forEach(o => { const a = t * 0.6 + o.userData.phase; o.position.set(Math.cos(a) * 0.9, 1.2 + 0.08 * Math.sin(t * 2 + o.userData.phase), Math.sin(a) * 0.9); });
  ringLight.material.color.setHSL(0.52, 0.7, 0.75 + 0.05 * Math.sin(t * 2));
  // Flasko
  flasko.position.lerp(flaskoTarget, k); flasko.position.y += Math.sin(t * 2.2) * 0.0025;
  v3.copy(camera.position); v3.y = flasko.position.y; flasko.lookAt(v3);
  prop.rotation.y = t * 18;
  if (flaskoSpin > 0) { flaskoSpin = Math.max(0, flaskoSpin - dt * 0.9); fBody.rotation.x = (1 - flaskoSpin) * Math.PI * 2; fBody.position.y = Math.sin((1 - flaskoSpin) * Math.PI) * 0.25; }
  else { fBody.rotation.x = 0; fBody.position.y = 0; }
  // lab pad HUD + beam symbols
  padMesh.visible = S.scene === "select" || S.scene === "manual" || S.scene === "lab"; padMesh.position.y = -0.13 + Math.sin(t * 1.6) * 0.004;
  icons.forEach(sp => { const u = (t * 0.1 + sp.userData.ph) % 1, a = sp.userData.ph * 6.28 + t * 0.35;
    sp.position.set(RX + Math.cos(a) * 0.5, 2.15 + u * 2.2, RZ + Math.sin(a) * 0.5); sp.material.opacity = Math.sin(u * Math.PI) * 0.9; });
  liquidLevel += (liquidTarget - liquidLevel) * k * 2; liquid.scale.y = Math.max(0.05, liquidLevel); liquid.position.y = 1.09 + 0.15 * liquid.scale.y;
  // bubble follows Flasko
  v3.copy(flasko.position); v3.y += 0.38; v3.project(camera);
  const onScreen = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && bubbleText;
  bubble.hidden = !onScreen;
  if (onScreen) { bubble.style.left = Math.min(innerWidth - 140, Math.max(140, (v3.x + 1) / 2 * innerWidth)) + "px"; bubble.style.top = Math.max(110, (1 - v3.y) / 2 * innerHeight) + "px"; }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- start
function redrawAll() { drawLobby(); drawHow(); onSel(); drawPad(); if (S.scene === "report") drawMonitor(); }
drawReactor("READY", "");
buildShelf();
paintPlate();
redrawAll();
if (document.fonts) Promise.all([document.fonts.load(FD(40), "가나ABC123"), document.fonts.load(FB(20), "가나ABC"), document.fonts.load(FB(20, 600), "가나")]).then(redrawAll, () => {});
go(location.hash.slice(1) || "lobby", true); camPos.copy(camPosT); camLook.copy(camLookT);
loop();
</script>
