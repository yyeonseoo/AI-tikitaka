<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReactPilot 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root {
  --ink: #17303f; --paper: #ffffff; --accent: #1f8fbf; --glass: rgba(255,255,255,.82); --warm: #ff9f6b;
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif; --font-body: "Noto Sans KR", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #dcecf5; color: var(--ink); font-family: var(--font-body); }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; z-index: 5; }
#nav { top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 300px); }
#nav button { font: 13px var(--font-display); border: 0; border-radius: 99px; padding: 5px 12px; background: var(--glass); color: var(--ink); cursor: pointer; }
#nav button[aria-current="true"] { background: var(--accent); color: var(--paper); }
#badge { top: 12px; right: 12px; font-size: 12px; padding: 5px 12px; border-radius: 99px; background: var(--glass); max-width: 280px; }
#prompt { bottom: 22px; left: 50%; transform: translateX(-50%); font: 18px var(--font-display); border: 0; border-radius: 99px; padding: 12px 26px;
  background: var(--ink); color: var(--paper); cursor: pointer; box-shadow: 0 6px 20px rgba(23,48,63,.25); max-width: calc(100% - 40px); }
#prompt:disabled { opacity: .7; cursor: default; }
#prompt2 { bottom: 78px; left: 50%; transform: translateX(-50%); font: 14px var(--font-display); border: 0; border-radius: 99px; padding: 7px 16px; background: var(--glass); color: var(--ink); cursor: pointer; }
#tip { pointer-events: none; font: 14px var(--font-display); padding: 4px 10px; border-radius: 8px; background: var(--ink); color: var(--paper); transform: translate(14px, 14px); white-space: nowrap; }
#bubble { pointer-events: none; font-size: 14px; line-height: 1.5; padding: 10px 14px; border-radius: 16px; background: var(--paper); box-shadow: 0 6px 18px rgba(23,48,63,.18);
  max-width: 260px; transform: translate(-50%, -100%); }
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 8px solid transparent; border-top-color: var(--paper); border-bottom: 0; transform: translateX(-50%); }
#fail { inset: 0; display: grid; place-items: center; text-align: center; background: #dcecf5; font-size: 16px; padding: 24px; }
button:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" aria-label="1인칭 3D 실험실"></canvas>
<nav id="nav" class="ui" aria-label="장면 이동"></nav>
<div id="badge" class="ui">시뮬레이션 · 수율은 Pfizer 공개 HTE 데이터의 실측값</div>
<button id="prompt2" class="ui" hidden></button>
<button id="prompt" class="ui"></button>
<div id="tip" class="ui" hidden></div>
<div id="bubble" class="ui" hidden></div>
<div id="fail" class="ui" hidden><p>이 브라우저에서는 3D를 표시할 수 없어요.<br><a href="../demo/index.html">2D 데모 열기</a></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../demo/data.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- data
const D = window.DEMO;
const NEAR = 5, MANUAL_TRIES = 12;
const GLOBAL = { random: 27.1, bo: 21.1, history: 16.5, ai: 13.7, hit20: 87, bh: 65 };   // report 4.2 / 4.3
const noteOf = (slot, name) => (D.mols[slot + "|" + name] || {}).note || name;
const S = { scene: "lobby", sel: 0, pair: 0, opened: false,
  manual: null, ai: null };
function resetRuns() {
  S.manual = { picks: { ligand: null, base: null, solvent: null }, tries: [], best: 0, foundAt: null };
  S.ai = { round: 0, revealed: [], best: 0, foundAt: null };
}
resetRuns();
const P = () => D.pairs[S.pair];
function lists(p) {
  const L = [], B = [], V = [];
  p.conds.forEach(c => { if (!L.includes(c[0])) L.push(c[0]); if (!B.includes(c[1])) B.push(c[1]); if (!V.includes(c[2])) V.push(c[2]); });
  return { ligand: L, base: B, solvent: V };
}
const stars = p => p.nearCount <= 3 ? "★★★" : p.nearCount <= 8 ? "★★" : "★";

// ---------------------------------------------------------------- three setup
const canvas = document.getElementById("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById("fail").hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcecf5);
scene.fog = new THREE.Fog(0xdcecf5, 14, 32);
const camera = new THREE.PerspectiveCamera(60, 1, 0.03, 100);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb5d2e2, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3, 8, 5); scene.add(sun);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const M = (color, extra) => new THREE.MeshToonMaterial(Object.assign({ color }, extra || {}));
const B = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
function add(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); (parent || scene).add(m); return m; }
function group(x, y, z, parent) { const g = new THREE.Group(); g.position.set(x, y, z); (parent || scene).add(g); return g; }
function canvasTex(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false; return { c, ctx: c.getContext("2d"), tex }; }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function screenPlane(w, h, cw, ch, x, y, z, ry, parent) {
  const t = canvasTex(cw, ch); const m = add(new THREE.PlaneGeometry(w, h), B(0xffffff, { map: t.tex }), x, y, z, parent); m.rotation.y = ry || 0; return Object.assign(t, { mesh: m });
}
const FD = (px) => `${px}px Jua, "Noto Sans KR", sans-serif`;
const FB = (px, w) => `${w || 400} ${px}px "Noto Sans KR", sans-serif`;

// ---------------------------------------------------------------- room
add(new THREE.PlaneGeometry(40, 40), M(0xeaf3f8), 0, 0, 0).rotation.x = -Math.PI / 2;
const wallM = M(0xf4f9fc);
add(new THREE.BoxGeometry(16, 4.2, 0.2), wallM, 0, 2.1, -4.1);
add(new THREE.BoxGeometry(0.2, 4.2, 11.2), wallM, -8.1, 2.1, 1.5);
add(new THREE.BoxGeometry(0.2, 4.2, 11.2), wallM, 8.1, 2.1, 1.5);
add(new THREE.BoxGeometry(6.5, 4.2, 0.2), wallM, -4.75, 2.1, 7.1);
add(new THREE.BoxGeometry(6.5, 4.2, 0.2), wallM, 4.75, 2.1, 7.1);
add(new THREE.BoxGeometry(3, 1.6, 0.2), wallM, 0, 3.4, 7.1);
add(new THREE.BoxGeometry(16.2, 0.08, 0.06), M(0x8fd0f0), 0, 1.05, -3.98);       // wall stripe
const ringLight = add(new THREE.TorusGeometry(1.1, 0.05, 8, 48), B(0x9fe6f5), 0.4, 3.6, -2.3); ringLight.rotation.x = Math.PI / 2;

// ---------------------------------------------------------------- interaction registry
const clickables = [];
function clickable(obj, label, fn, when) { obj.userData.click = { label, fn, when: when || (() => true) }; clickables.push(obj); return obj; }
function setGlow(obj, on) {
  obj.traverse(m => {
    if (!m.material || !m.material.emissive) return;
    if (m.userData.e0 === undefined) m.userData.e0 = m.material.emissive.getHex();
    m.material.emissive.setHex(on ? 0x2a9fd0 : m.userData.e0);
  });
}
const tweens = [];
function tween(d, fn, done) { tweens.push({ t: 0, d, fn, done }); }

// ---------------------------------------------------------------- lobby: door, sign, board, marquee
const doorL = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), M(0xcfeaf5, { transparent: true, opacity: 0.85 }), -0.75, 1.3, 7.1);
const doorR = add(new THREE.BoxGeometry(1.5, 2.6, 0.08), M(0xcfeaf5, { transparent: true, opacity: 0.85 }), 0.75, 1.3, 7.1);
const doorGroup = new THREE.Group(); doorGroup.add(doorL, doorR); scene.add(doorGroup);
clickable(doorGroup, "실험실 문", () => enterLab(), () => S.scene === "lobby");
const sign = screenPlane(2.2, 0.5, 880, 200, 0, 2.95, 7.21);
sign.ctx.fillStyle = "#17303f"; rrect(sign.ctx, 0, 0, 880, 200, 40); sign.ctx.fill();
sign.ctx.fillStyle = "#9fe6f5"; sign.ctx.font = FD(96); sign.ctx.textAlign = "center"; sign.ctx.textBaseline = "middle"; sign.ctx.fillText("ReactPilot 랩", 440, 104);
const board = screenPlane(2.4, 1.5, 960, 600, -3.4, 1.8, 7.21);
const marquee = screenPlane(5.6, 0.34, 2240, 136, 0, 3.75, 7.21);
function drawLobby() {
  let x = board.ctx; x.fillStyle = "#ffffff"; rrect(x, 0, 0, 960, 600, 40); x.fill(); x.strokeStyle = "#8fd0f0"; x.lineWidth = 10; x.stroke();
  x.fillStyle = "#1f8fbf"; x.font = FD(46); x.textAlign = "left"; x.fillText("오늘의 문제", 60, 100);
  x.fillStyle = "#17303f"; x.font = FD(64); x.fillText("새 기질이 왔다!", 60, 210); x.fillText("384개 조건 중", 60, 300); x.fillText("어디부터 실험할까?", 60, 390);
  x.font = FB(30); x.fillStyle = "#5a7180"; x.fillText("리간드 12 × 염기 8 × 용매 4 = 384", 60, 500); board.tex.needsUpdate = true;
  x = marquee.ctx; x.fillStyle = "#17303f"; x.fillRect(0, 0, 2240, 136); x.fillStyle = "#ffd36b"; x.font = FD(70); x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(`무작위 대비 실험 약 50% 감소  ·  표준 BO보다 35% 적음  ·  상위 20개 안 성공 ${GLOBAL.hit20}%`, 1120, 72); marquee.tex.needsUpdate = true;
}

// ---------------------------------------------------------------- select: carousel
const TT = group(-4.5, 0, 0);
add(new THREE.CylinderGeometry(1.55, 1.7, 0.9, 40), M(0xd5edf7), 0, 0.45, 0, TT);
const spin = group(0, 0.92, 0, TT);
const slotGroups = [];
D.pairs.forEach((p, i) => {
  const a = i * 2 * Math.PI / D.pairs.length, g = group(Math.sin(a) * 1.3, 0, Math.cos(a) * 1.3, spin);
  const hue = 0.5 + 0.05 * (i % 5);
  add(new THREE.CylinderGeometry(0.07, 0.08, 0.26, 16), M(new THREE.Color().setHSL(hue, 0.5, 0.7)), -0.06, 0.13, 0, g);
  add(new THREE.CylinderGeometry(0.07, 0.08, 0.2, 16), M(new THREE.Color().setHSL(hue + 0.1, 0.5, 0.75)), 0.08, 0.1, 0, g);
  add(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 12), M(0x17303f), -0.06, 0.29, 0, g);
  clickable(g, "", () => { if (i === S.sel) choosePair(); else { S.sel = i; onSel(); } }, () => S.scene === "select");
  g.userData.idx = i; slotGroups.push(g);
});
const arrowM = () => M(0x1f8fbf);
const arL = add(new THREE.ConeGeometry(0.16, 0.34, 3), arrowM(), -6.35, 1.35, 1.0); arL.rotation.z = Math.PI / 2;
const arR = add(new THREE.ConeGeometry(0.16, 0.34, 3), arrowM(), -2.65, 1.35, 1.0); arR.rotation.z = -Math.PI / 2;
clickable(arL, "이전 반응", () => { S.sel = (S.sel + D.pairs.length - 1) % D.pairs.length; onSel(); }, () => S.scene === "select");
clickable(arR, "다음 반응", () => { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }, () => S.scene === "select");
const holo = group(-4.5, 2.05, 0.2);
add(new THREE.CylinderGeometry(0.75, 1.1, 1.2, 32, 1, true), B(0x9fe6f5, { transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false }), -4.5, 1.5, 0.2);
const molA = group(-0.45, 0, 0, holo), molB = group(0.45, 0, 0, holo);
const selLabel = screenPlane(2.6, 0.62, 1040, 248, -4.5, 3.0, 0.4);
const CPK = { C: 0x5b6b75, N: 0x3b6fe0, O: 0xe0503b, Cl: 0x3fbf5f, Br: 0xa0522d, I: 0x8a2be2, F: 0x7fd0a0, S: 0xe0c040, B: 0xf09090, P: 0xff9f40, K: 0x9b59d0 };
function buildMol(gr, mol) {
  while (gr.children.length) gr.remove(gr.children[0]);
  if (!mol) return;
  const lines = mol.split("\n"), na = parseInt(lines[3].slice(0, 3)), nb = parseInt(lines[3].slice(3, 6));
  const atoms = [];
  for (let i = 0; i < na; i++) { const l = lines[4 + i]; atoms.push({ p: new THREE.Vector3(+l.slice(0, 10), +l.slice(10, 20), +l.slice(20, 30)), s: l.slice(31, 34).trim() }); }
  const heavy = atoms.filter(a => a.s !== "H"); const c = new THREE.Vector3(); heavy.forEach(a => c.add(a.p)); c.divideScalar(heavy.length);
  const sc = 0.055;
  atoms.forEach(a => { if (a.s === "H") return; add(new THREE.SphereGeometry(a.s === "C" ? 0.028 : 0.036, 12, 10), M(CPK[a.s] || 0x999999), (a.p.x - c.x) * sc, (a.p.y - c.y) * sc, (a.p.z - c.z) * sc, gr); });
  for (let i = 0; i < nb; i++) {
    const l = lines[4 + na + i], a = atoms[parseInt(l.slice(0, 3)) - 1], b = atoms[parseInt(l.slice(3, 6)) - 1];
    if (a.s === "H" || b.s === "H") continue;
    const pa = a.p.clone().sub(c).multiplyScalar(sc), pb = b.p.clone().sub(c).multiplyScalar(sc), len = pa.distanceTo(pb);
    const m = add(new THREE.CylinderGeometry(0.009, 0.009, len, 6), M(0xb9c9d3), 0, 0, 0, gr);
    m.position.copy(pa).add(pb).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pb.clone().sub(pa).normalize());
  }
}
function onSel() {
  const p = D.pairs[S.sel];
  buildMol(molA, (D.mols["electrophile|" + p.electrophile] || {}).mol);
  buildMol(molB, (D.mols["nucleophile|" + p.nucleophile] || {}).mol);
  const x = selLabel.ctx; x.clearRect(0, 0, 1040, 248); x.fillStyle = "rgba(23,48,63,.9)"; rrect(x, 0, 0, 1040, 248, 40); x.fill();
  x.textAlign = "center"; x.fillStyle = "#9fe6f5"; x.font = FD(56); x.fillText(`${noteOf("electrophile", p.electrophile)} + ${noteOf("nucleophile", p.nucleophile)}`, 520, 98);
  x.fillStyle = "#ffd36b"; x.font = FD(48); x.fillText(`난이도 ${stars(p)}  ·  좋은 조건 384개 중 ${p.nearCount}개  ·  ${S.sel + 1}/${D.pairs.length}`, 520, 186);
  selLabel.tex.needsUpdate = true;
  drawPad(); speak(S.scene === "select" ? "오늘 실험할 반응을 골라 주세요. 별이 많을수록 좋은 조건이 드물어요." : null);
}

// ---------------------------------------------------------------- bench, reactor, shelf, plate, red button
add(new THREE.BoxGeometry(5.6, 0.1, 1.5), M(0xffffff), 0.1, 0.9, -2.4);
add(new THREE.BoxGeometry(5.4, 0.85, 1.3), M(0xd5edf7), 0.1, 0.43, -2.4);
const RX = 0.45, RZ = -2.35;
add(new THREE.CylinderGeometry(0.34, 0.4, 0.14, 32), M(0x9fb7c4), RX, 1.02, RZ);
const liquid = add(new THREE.CylinderGeometry(0.25, 0.25, 0.3, 32), M(0x9fe6f5, { transparent: true, opacity: 0.85 }), RX, 1.24, RZ);
add(new THREE.CylinderGeometry(0.28, 0.28, 0.6, 32, 1, true), M(0xe9f7fc, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }), RX, 1.39, RZ);
add(new THREE.CylinderGeometry(0.31, 0.31, 0.06, 32), M(0x7fa3b5), RX, 1.71, RZ);
const lever = group(RX + 0.42, 1.2, RZ);
add(new THREE.CylinderGeometry(0.02, 0.02, 0.36, 8), M(0x7fa3b5), 0, 0.15, 0, lever);
const leverKnob = add(new THREE.SphereGeometry(0.06, 16, 12), M(0xff9f6b), 0, 0.34, 0, lever);
clickable(lever, "레버: 반응 시작", () => pullLever(), () => (S.scene === "manual" && manualReady()) || (S.scene === "lab" && S.ai.round < 10));
const rScreen = screenPlane(0.8, 0.25, 640, 200, RX, 1.98, RZ - 0.2);
function drawReactor(big, small, color) {
  const x = rScreen.ctx; x.fillStyle = "#17303f"; rrect(x, 0, 0, 640, 200, 30); x.fill();
  x.textAlign = "center"; x.fillStyle = color || "#9fe6f5"; x.font = FD(84); x.fillText(big, 320, 104);
  x.fillStyle = "#c4d6e1"; x.font = FD(36); x.fillText(small, 320, 168); rScreen.tex.needsUpdate = true;
}
const redBtn = add(new THREE.SphereGeometry(0.11, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), M(0xe0503b), -2.3, 0.95, -1.95);
add(new THREE.CylinderGeometry(0.15, 0.15, 0.04, 20), M(0x17303f), -2.3, 0.96, -1.95);
clickable(redBtn, "AI 부르기", () => go("lab"), () => S.scene === "manual");
// shelf
const SH = group(-1.35, 0, -3.55);
[1.3, 1.68, 2.06].forEach(y => add(new THREE.BoxGeometry(2.5, 0.04, 0.34), M(0xffffff), 0, y, 0, SH));
add(new THREE.BoxGeometry(2.5, 1.2, 0.04), M(0xd5edf7), 0, 1.7, -0.17, SH);
const SLOT_COLOR = { ligand: 0x8fd0f0, base: 0xffd36b, solvent: 0x6fd39a };
const SLOT_KO = { ligand: "리간드", base: "염기", solvent: "용매" };
let bottles = [];
function buildShelf() {
  bottles.forEach(b => { SH.remove(b); const k = clickables.indexOf(b); if (k >= 0) clickables.splice(k, 1); });
  bottles = [];
  const ls = lists(P());
  [["ligand", 2.06], ["base", 1.68], ["solvent", 1.3]].forEach(([slot, y]) => {
    const names = ls[slot], gap = 2.3 / names.length;
    names.forEach((n, i) => {
      const g = group(-1.15 + gap * (i + 0.5), y + 0.02, 0.02, SH);
      add(new THREE.CylinderGeometry(0.045, 0.055, 0.19, 14), M(SLOT_COLOR[slot]), 0, 0.095, 0, g);
      add(new THREE.CylinderGeometry(0.025, 0.025, 0.05, 10), M(0x17303f), 0, 0.215, 0, g);
      add(new THREE.BoxGeometry(0.07, 0.06, 0.005), M(0xffffff), 0, 0.09, 0.052, g);
      g.userData.slot = slot; g.userData.name = n;
      clickable(g, `${SLOT_KO[slot]} · ${n === "없음" ? "넣지 않음" : n}`, () => pick(slot, n, g), () => S.scene === "manual" && S.manual.tries.length < MANUAL_TRIES);
      bottles.push(g);
    });
  });
}
// plate
const PX = 1.95, PZ = -2.35, COLS = 32, ROWS = 12;
add(new THREE.BoxGeometry(1.42, 0.04, 0.58), M(0xffffff), PX, 0.97, PZ);
const wellGeo = new THREE.CylinderGeometry(0.016, 0.016, 0.012, 10);
const wells = new THREE.InstancedMesh(wellGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), COLS * ROWS);
wells.position.set(PX, 0.995, PZ); scene.add(wells);
{ const o = new THREE.Object3D(); for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { o.position.set((c - (COLS - 1) / 2) * 0.042, 0, (r - (ROWS - 1) / 2) * 0.044); o.updateMatrix(); wells.setMatrixAt(r * COLS + c, o.matrix); } }
const cA = new THREE.Color(0xe4eef4), cB = new THREE.Color(0x1fb3e0), cDone = new THREE.Color(0xff9f6b), cWin = new THREE.Color(0x2f9e6a), tmpC = new THREE.Color();
function wellIndex(p, i) { const ls = lists(p), c = p.conds[i]; return ls.ligand.indexOf(c[0]) * COLS + ls.base.indexOf(c[1]) * 4 + ls.solvent.indexOf(c[2]); }
function paintPlate() {
  const p = P(), r = Math.min(S.ai.round, 9), pred = p.preds[r];
  for (let i = 0; i < p.conds.length; i++) {
    const done = S.ai.revealed.includes(i);
    if (done) tmpC.copy(p.y[i] >= p.best - NEAR ? cWin : cDone);
    else tmpC.copy(cA).lerp(cB, Math.pow(Math.max(0, Math.min(1, pred[i] / 100)), 1.5));
    wells.setColorAt(wellIndex(p, i), tmpC);
  }
  wells.instanceColor.needsUpdate = true;
}
// monitor
const monitor = screenPlane(3.8, 2.14, 1280, 720, 7.97, 1.95, -0.4, -Math.PI / 2);
add(new THREE.BoxGeometry(0.06, 2.3, 3.96), M(0x17303f), 8.02, 1.95, -0.4);

// ---------------------------------------------------------------- how: hologram
const HOW = group(4.5, 0, 3.6);

  lab: { name: "AI와 실험", cam: [1.1, 1.95, 0.75], look: [1.1, 1.0, -2.45], fl: [RX - 0.9, 2.0, -1.9], say: "과거 14쌍 데이터로 학습해서 추천했어요. 레버를 당기면 4개를 한 번에 실험해요." },
  report: { name: "나 vs AI", cam: [4.4, 1.85, -0.4], look: [7.9, 1.9, -0.4], fl: [6.6, 2.7, 0.9], say: "왼쪽은 이번 반응의 곡선, 오른쪽 아래는 15쌍 평균 성능이에요." },
  how: { name: "원리", cam: [4.5, 1.8, 6.6], look: [4.5, 1.3, 3.4], fl: [3.1, 2.1, 4.6], say: "구슬을 눌러 보세요. 예측, 실험, 재학습이 계속 돌아요." },
};
const camPos = new THREE.Vector3(...SCENES.lobby.cam), camLook = new THREE.Vector3(...SCENES.lobby.look);
const camPosT = camPos.clone(), camLookT = camLook.clone();
const nav = document.getElementById("nav");
Object.entries(SCENES).forEach(([k, s]) => { const b = document.createElement("button"); b.textContent = s.name; b.dataset.k = k; b.onclick = () => go(k); nav.appendChild(b); });
function go(k) {
  if (!SCENES[k]) k = "lobby";
  if (k !== "lobby" && !S.opened) { S.opened = true; doorL.position.x = -2.15; doorR.position.x = 2.15; }
  if ((k === "manual" || k === "lab" || k === "report") && !bottles.length) { S.pair = S.sel; resetRuns(); buildShelf(); }
  S.scene = k; const s = SCENES[k];
  camPosT.set(...s.cam); camLookT.set(...s.look); flaskoTarget.set(...s.fl);
  if (reduceMotion) { camPos.copy(camPosT); camLook.copy(camLookT); }
  if (k === "lab") { paintPlate(); if (!S.ai.revealed.length) drawReactor("AI 준비 완료", "레버를 당겨 주세요"); }
  if (k === "report") drawMonitor();
  if (k === "select") onSel();
  speak(s.say); drawPad(); updatePrompt();
  [...nav.children].forEach(b => b.setAttribute("aria-current", b.dataset.k === k));
  if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
}
const promptBtn = document.getElementById("prompt"), prompt2 = document.getElementById("prompt2");
function updatePrompt() {
  const k = S.scene; let t = "", act = null, t2 = "", act2 = null;
  if (k === "lobby") { t = "문을 클릭해 입장"; act = enterLab; }
  else if (k === "select") { t = "이 반응으로 실험하기"; act = choosePair; t2 = "◀ ▶ 화살표로 돌리기"; act2 = () => { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }; }
  else if (k === "manual") {
    if (S.manual.tries.length >= MANUAL_TRIES || S.manual.foundAt) { t = "이제 AI와 같은 반응 하기"; act = () => go("lab"); }
    else if (manualReady()) { t = "레버 당기기 (실험 1회 사용)"; act = pullLever; t2 = "포기하고 AI 부르기"; act2 = () => go("lab"); }
    else { t = "선반에서 리간드 · 염기 · 용매를 하나씩 고르세요"; t2 = "AI 부르기"; act2 = () => go("lab"); }
  } else if (k === "lab") {
    if (S.ai.round < 10) { t = "레버 당기기 (AI 추천 4개 실험)"; act = pullLever; if (S.ai.revealed.length) { t2 = "결과 모니터 보기"; act2 = () => go("report"); } }
    else { t = "결과 모니터 보기"; act = () => go("report"); }
  } else if (k === "report") { t = "다른 반응 해 보기"; act = () => go("select"); t2 = "원리 보기"; act2 = () => go("how"); }
  else { t = "입구로 돌아가기"; act = () => go("lobby"); }
  promptBtn.textContent = t; promptBtn.disabled = !act; promptBtn.onclick = act;
  prompt2.hidden = !t2; prompt2.textContent = t2; prompt2.onclick = act2;
}

// ---------------------------------------------------------------- input
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), look = { x: 0, y: 0 };
const tip = document.getElementById("tip");
let hovered = null;
function hitTest() {
  ray.setFromCamera(ptr, camera);
  for (const h of ray.intersectObjects(clickables, true)) {
    let o = h.object; while (o && !o.userData.click) o = o.parent;
    if (o && o.userData.click.when()) return o;
  }
  return null;
}
canvas.addEventListener("pointermove", e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); look.x = ptr.x; look.y = ptr.y;
  const o = hitTest();
  if (o !== hovered) { if (hovered) setGlow(hovered, false); hovered = o; if (o) setGlow(o, true); }
  const label = o ? (o.userData.click.label || (o.userData.idx === S.sel ? "이 반응 선택" : "이 반응으로 돌리기")) : "";
  tip.hidden = !label; tip.textContent = label; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
  canvas.style.cursor = o ? "pointer" : "default";
});
canvas.addEventListener("click", e => { ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); const o = hitTest(); if (o) o.userData.click.fn(); });
addEventListener("keydown", e => {
  if (S.scene === "select" && e.key === "ArrowLeft") { S.sel = (S.sel + D.pairs.length - 1) % D.pairs.length; onSel(); }
  if (S.scene === "select" && e.key === "ArrowRight") { S.sel = (S.sel + 1) % D.pairs.length; onSel(); }
});
addEventListener("hashchange", () => go(location.hash.slice(1)));
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock(), v3 = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k = 1 - Math.exp(-dt * 3);
  camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
  camera.position.copy(camPos); camera.lookAt(camLook); camera.rotateY(-look.x * 0.18); camera.rotateX(look.y * 0.08);
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const q = Math.min(1, w.t / w.d); w.fn(q); if (q >= 1) { tweens.splice(i, 1); w.done && w.done(); } }
  // carousel
  const want = -S.sel * 2 * Math.PI / D.pairs.length; let d = want - spin.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); spin.rotation.y += d * k * 1.5;
  slotGroups.forEach((g, i) => { g.position.y = i === S.sel ? 0.06 + 0.02 * Math.sin(t * 3) : 0; });
  molA.rotation.y = molB.rotation.y = t * 0.6;
  // lever pulse when ready
  const ready = (S.scene === "manual" && manualReady()) || (S.scene === "lab" && S.ai.round < 10);
  leverKnob.scale.setScalar(ready ? 1 + 0.15 * Math.sin(t * 6) : 1);
  // hologram + orbs
  ringH.rotation.z = t * 0.5; orbs.forEach(o => { const a = t * 0.6 + o.userData.phase; o.position.set(Math.cos(a) * 0.9, 1.2 + 0.08 * Math.sin(t * 2 + o.userData.phase), Math.sin(a) * 0.9); });
  ringLight.material.color.setHSL(0.52, 0.7, 0.75 + 0.05 * Math.sin(t * 2));
  // Flasko
  flasko.position.lerp(flaskoTarget, k); flasko.position.y += Math.sin(t * 2.2) * 0.0025;
  v3.copy(camera.position); v3.y = flasko.position.y; flasko.lookAt(v3);
  prop.rotation.y = t * 18;
  if (flaskoSpin > 0) { flaskoSpin = Math.max(0, flaskoSpin - dt * 0.9); fBody.rotation.x = (1 - flaskoSpin) * Math.PI * 2; fBody.position.y = Math.sin((1 - flaskoSpin) * Math.PI) * 0.25; }
  else { fBody.rotation.x = 0; fBody.position.y = 0; }
  // hands
  const bob = Math.sin(t * 1.6) * 0.006;
  handL.position.set(HL0.x, HL0.y + bob, HL0.z); padMesh.position.y = -0.13 + bob;
  handR.position.set(HR0.x, HR0.y - bob, HR0.z); handR.rotation.set(0.25, -0.25, 0.15);
  if (handAnim) {
    handAnim.t += dt / 0.55; const s = Math.sin(Math.min(1, handAnim.t) * Math.PI);
    if (handAnim.kind === "reach") { handR.position.z -= 0.22 * s; handR.position.y += 0.08 * s; handR.position.x -= 0.06 * s; handR.rotation.x -= 0.5 * s; }
    else { handR.position.y -= 0.08 * s; handR.position.z -= 0.08 * s; handR.rotation.x += 0.6 * s; }
    if (handAnim.t >= 1) handAnim = null;
  }
  // bubble follows Flasko
  v3.copy(flasko.position); v3.y += 0.38; v3.project(camera);
  const onScreen = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && bubbleText;
  bubble.hidden = !onScreen;
  if (onScreen) { bubble.style.left = Math.min(innerWidth - 140, Math.max(140, (v3.x + 1) / 2 * innerWidth)) + "px"; bubble.style.top = Math.max(110, (1 - v3.y) / 2 * innerHeight) + "px"; }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- start
function redrawAll() { drawLobby(); drawHow(); onSel(); drawPad(); if (S.scene === "report") drawMonitor(); }
drawReactor("대기 중", "반응을 먼저 고르세요");
paintPlate();
redrawAll();
if (document.fonts) Promise.all([document.fonts.load(FD(40)), document.fonts.load(FB(20))]).then(redrawAll, () => {});
go(location.hash.slice(1) || "lobby");
loop();
</script>
